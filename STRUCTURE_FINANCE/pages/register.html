<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dăng ký tài khoản</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <nav>
      <a class="logo" href="#">
        <div class="logo-icon">
          <img src="../assets/icon/Container.svg" alt="" />
        </div>
        <span class="logo-text">Rikkei <span>Cinema</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="#">Trang Chủ</a></li>
        <li><a href="#">Thông Tin</a></li>
        <li><a href="#">Liên Hệ</a></li>
        <li><a href="./login.html" class="btn-nav">Đăng Nhập</a></li>
      </ul>
    </nav>

    <main class="hero">
      <div class="card">
        <h1 class="card__title">Tạo tài khoản mới</h1>
        <p class="card__subtitle">Đăng ký để đặt vé xem phim ngay hôm nay</p>

        <form class="form" onsubmit="return false;">
          <div class="form__group">
            <label class="form__label" for="fullname">Họ và tên</label>
            <input
              class="form__input"
              type="text"
              id="fullname"
              placeholder="Nguyễn Văn A"
              autocomplete="name"
            />
            <span id="errName" class="text_err"></span>
          </div>

          <div class="form__group">
            <label class="form__label" for="email">Email</label>
            <input
              class="form__input"
              type="text"
              id="email"
              placeholder="email@example.com"
              autocomplete="email"
            />
            <span id="errEmail" class="text_err"></span>
          </div>

          <div class="form__group">
            <label class="form__label" for="password">Mật khẩu</label>
            <div class="form__input-wrap">
              <input
                class="form__input"
                type="password"
                id="password"
                placeholder="nhập mật khẩu"
              />
              <button
                type="button"
                class="form__eye"
                aria-label="Hiển thị mật khẩu"
              >
                <i class="far fa-eye togglePass"></i>
              </button>
              <span id="errPassword" class="text_err"></span>
            </div>
          </div>

          <div class="form__group">
            <label class="form__label" for="confirm">Xác nhận mật khẩu</label>
            <div class="form__input-wrap">
              <input
                class="form__input"
                type="password"
                id="confirm"
                placeholder="Nhập lại mật khẩu"
              />
              <button
                type="button"
                class="form__eye"
                aria-label="Hiển thị mật khẩu"
              >
                <i class="far fa-eye togglePass"></i>
              </button>
              <span class="errPassword" class="text_err"></span>
            </div>
          </div>

          <label class="form__check">
            <input type="checkbox" id="terms" />
            <span class="form__check-box"></span>
            <span class="form__check-text">
              Tôi đồng ý với
              <a href="#" class="link-red">điều khoản sử dụng</a> và chính sách
              bảo mật của CineEdu.
            </span>
            <span id="errTerms"></span>
          </label>

          <button class="btn-register" type="submit">Đăng ký &nbsp;</button>

          <p class="form__login-hint">
            Đã có tài khoản?
            <a href="./login.html" class="link-red">Đăng nhập ngay</a>
          </p>
        </form>
      </div>
    </main>
    <span class="footer"> © 2026 RikkeiEdu. Tất cả quyền được bảo mật . </span>
    <div id="toast-container"></div>
    <script src="../js/register.js"></script>
  </body>
</html>
