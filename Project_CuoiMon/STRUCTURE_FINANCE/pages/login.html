<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang đăng nh</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav>
      <a class="logo" href="#">
        <div class="logo-icon">
          <img src="../assets/icon/Container.svg" alt="" />
        </div>
        <span class="logo-text">Rikkei <span>Cinema</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="#">Trang Chủ</a></li>
        <li><a href="#">Thông Tin</a></li>
        <li><a href="#">Liên Hệ</a></li>
        <li><a href="#" class="btn-nav">Đăng Nhập</a></li>
      </ul>
    </nav>

    <!-- MAIN -->
    <main>
      <div class="card">
        <!-- Banner popcorn -->
        <div class="card-banner">
          <img src="../assets/images/Background.svg" alt="" />
        </div>

        <!-- Body -->
        <div class="card-body">
          <h1 class="card-title">Chào mừng quay trở lại</h1>

          <!-- Email -->
          <div>
            <label for="email">Email</label>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="Nhập email của bạn" />
              <span class="input-icon">
                <img src="../assets/icon/icon_email.svg" alt="" />
              </span>
            </div>
          </div>

          <!-- Password -->
          <div>
            <label for="password">Mật khẩu</label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu của bạn"
              />
              <span class="input-icon" onclick="togglePass()">
                <img src="../assets/icon/eye.svg" alt="" />
              </span>
            </div>
          </div>

          <!-- Options -->
          <div class="row-options">
            <label class="remember">
              <input type="checkbox" /> Ghi nhớ đăng nhập
            </label>
            <a href="#" class="forgot">Quên mật khẩu?</a>
          </div>

          <!-- Submit -->
          <button class="btn-submit">
            Đăng nhập
            <img src="../assets/icon/icon_login.svg" alt="" />
          </button>

          <p class="register-link">
            Bạn chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
